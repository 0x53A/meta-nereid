<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 300" role="img" aria-labelledby="title desc">
  <title id="title">100% Certified Slop</title>
  <desc id="desc">An animated rainbow certification stamp declaring this project to be AI generated.</desc>

  <defs>
    <linearGradient id="rainbow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff3d8d"/>
      <stop offset=".18" stop-color="#ff8a00"/>
      <stop offset=".35" stop-color="#ffe600"/>
      <stop offset=".52" stop-color="#42f59e"/>
      <stop offset=".69" stop-color="#22c7ff"/>
      <stop offset=".84" stop-color="#8b5cff"/>
      <stop offset="1" stop-color="#ff3dce"/>
    </linearGradient>

    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".45" stop-color="#fff" stop-opacity="0"/>
      <stop offset=".5" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".55" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>

    <radialGradient id="stampFill" cx=".5" cy=".25" r=".9">
      <stop offset="0" stop-color="#32234d" stop-opacity=".98"/>
      <stop offset=".65" stop-color="#171224" stop-opacity=".98"/>
      <stop offset="1" stop-color="#0c0912" stop-opacity=".98"/>
    </radialGradient>

    <filter id="shadow" x="-30%" y="-40%" width="160%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="9" result="shadowBlur"/>
      <feOffset in="shadowBlur" dx="0" dy="10" result="shadowOffset"/>
      <feFlood flood-color="#050208" flood-opacity=".5" result="shadowColor"/>
      <feComposite in="shadowColor" in2="shadowOffset" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="3.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <clipPath id="stampClip">
      <rect x="68" y="42" width="624" height="216" rx="34"/>
    </clipPath>
  </defs>

  <style>
    .stamp {
      transform-origin: 380px 150px;
      animation: stamp-pop 6s cubic-bezier(.2,.9,.25,1.25) infinite;
    }

    .marching-ants {
      animation: dash 4s linear infinite;
    }

    .hue {
      animation: hue 5s linear infinite;
    }

    .shimmer {
      animation: shimmer 3.4s ease-in-out infinite;
    }

    .sparkle {
      transform-box: fill-box;
      transform-origin: center;
      animation: twinkle 2.2s ease-in-out infinite;
    }

    .s2 { animation-delay: -.45s; }
    .s3 { animation-delay: -.9s; }
    .s4 { animation-delay: -1.35s; }
    .s5 { animation-delay: -1.8s; }

    @keyframes stamp-pop {
      0%, 5% { transform: rotate(-3deg) scale(.94); }
      10%, 92% { transform: rotate(-3deg) scale(1); }
      95% { transform: rotate(-3deg) scale(1.025); }
      100% { transform: rotate(-3deg) scale(.94); }
    }

    @keyframes dash {
      to { stroke-dashoffset: -136; }
    }

    @keyframes hue {
      to { filter: hue-rotate(360deg); }
    }

    @keyframes shimmer {
      0%, 18% { transform: translateX(-620px) skewX(-16deg); opacity: 0; }
      28% { opacity: .9; }
      58%, 100% { transform: translateX(650px) skewX(-16deg); opacity: 0; }
    }

    @keyframes twinkle {
      0%, 100% { transform: scale(.35) rotate(0deg); opacity: .25; }
      45% { transform: scale(1.18) rotate(90deg); opacity: 1; }
      62% { transform: scale(.82) rotate(135deg); opacity: .75; }
    }

    @media (prefers-reduced-motion: reduce) {
      .stamp, .marching-ants, .hue, .shimmer, .sparkle {
        animation: none;
      }

      .stamp { transform: rotate(-3deg); }
      .shimmer { opacity: 0; }
      .sparkle { opacity: .9; }
    }
  </style>

  <g class="stamp" transform="rotate(-3 380 150)" filter="url(#shadow)">
    <rect x="60" y="34" width="640" height="232" rx="42"
          fill="url(#stampFill)" stroke="#05030a" stroke-width="18"/>

    <rect class="hue marching-ants" x="64" y="38" width="632" height="224" rx="38"
          fill="none" stroke="url(#rainbow)" stroke-width="10"
          stroke-dasharray="24 10" stroke-linecap="round"/>

    <rect x="78" y="52" width="604" height="196" rx="27"
          fill="none" stroke="url(#rainbow)" stroke-width="2.5" opacity=".75"/>

    <g fill="#fff" font-family="'Comic Sans MS', 'Comic Sans', 'Chalkboard SE', cursive"
       text-anchor="middle">
      <text x="380" y="108" font-size="36" font-weight="700" letter-spacing="3.5">
        <tspan font-family="'Noto Color Emoji', 'Apple Color Emoji', 'Segoe UI Emoji', sans-serif"
               font-weight="400" letter-spacing="0">💯</tspan><tspan dx="12">CERTIFIED</tspan>
      </text>

      <text class="hue" x="380" y="215" font-size="116" font-weight="700"
            letter-spacing="7" fill="url(#rainbow)" stroke="#fff" stroke-width="1.2"
            paint-order="stroke fill">
        SLOP
      </text>
    </g>

    <g class="hue" fill="url(#rainbow)" filter="url(#glow)" aria-hidden="true">
      <path class="sparkle s1" d="M90 69 96 83 110 89 96 95 90 109 84 95 70 89 84 83Z"/>
      <path class="sparkle s2" d="M665 65 669 76 680 80 669 84 665 95 661 84 650 80 661 76Z"/>
      <path class="sparkle s3" d="M706 164 711 177 724 182 711 187 706 200 701 187 688 182 701 177Z"/>
      <path class="sparkle s4" d="M53 177 57 187 67 191 57 195 53 205 49 195 39 191 49 187Z"/>
      <circle class="sparkle s5" cx="687" cy="227" r="5"/>
    </g>

    <g clip-path="url(#stampClip)" pointer-events="none" aria-hidden="true">
      <rect class="shimmer" x="20" y="20" width="180" height="260"
            fill="url(#shine)" opacity="0"/>
    </g>
  </g>
</svg>
