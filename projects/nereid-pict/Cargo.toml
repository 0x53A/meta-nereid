[package]
name = "nereid-pict"
version = "0.1.0"
edition = "2024"
authors = ["Lukas Rieger <code@lukasrieger.com>"]

# Standalone adapter with shared Pict inputs pinned to a published Git revision.
# Image recipe integration remains a separate step.
[workspace]

[features]
default = []
dev-ssh = []

[dependencies]
pict-host = { git = "ssh://git@github.com/0x53A/pict.git", rev = "2716e049954dd4a2812f13456e35857a7ba58524", default-features = false }
pict-protocol = { git = "ssh://git@github.com/0x53A/pict.git", rev = "2716e049954dd4a2812f13456e35857a7ba58524" }
anyhow = "1"
tokio = { version = "1", features = ["full"] }
evdev = "0.13.2"
libc = "0.2"
serde_json = "1"
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
