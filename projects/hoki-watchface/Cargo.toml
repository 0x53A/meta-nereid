[package]
name = "hoki-watchface"
version = "0.1.0"
edition = "2021"
description = "Minimal clock watchface for hoki watch"

[dependencies]
slint = { version = "1.15", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software"] }
chrono = "0.4"
libc = "0.2"
shell-words = "1.1"

[build-dependencies]
slint-build = "1.15"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
