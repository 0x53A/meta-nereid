[package]
name = "hoki-spo2"
version = "0.1.0"
edition = "2021"
description = "SpO2 (blood oxygen) measurement app for Fossil Gen 6 (hoki) on AsteroidOS"

[dependencies]
libc = "0.2"
slint = { version = "1.15", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software"] }
zbus = { version = "5", default-features = false, features = ["blocking-api"] }

[build-dependencies]
slint-build = "1.15"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
