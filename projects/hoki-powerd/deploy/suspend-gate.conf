[Service]
ExecStartPre=/usr/bin/python3 /usr/libexec/hoki-wifi-sleep prepare
# Fail the unit before systemd-sleep runs if display/sensor/wake preparation
# changed. Unlike system-sleep hooks, ExecStartPre failure prevents suspend.
ExecStartPre=/usr/local/bin/hoki-powerd --check-sleep
ExecStopPost=/usr/bin/python3 /usr/libexec/hoki-wifi-sleep restore
