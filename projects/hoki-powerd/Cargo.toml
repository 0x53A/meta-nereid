[package]
name = "hoki-powerd"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "sync"] }
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
