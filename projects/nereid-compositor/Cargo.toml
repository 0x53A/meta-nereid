[package]
rust-version.workspace = true
name = "nereid-compositor"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = { workspace = true }
serde = { workspace = true, features = ["derive"] }
shell-words = { workspace = true }
# Wayland compositor framework
smithay = { workspace = true, features = ["wayland_frontend"] }

# Wayland protocol support (server for compositor, client for test tools)
wayland-server = { workspace = true }
wayland-protocols = { workspace = true, features = ["server", "client", "staging"] }
wayland-client = { workspace = true }
wayland-protocols-wlr = { workspace = true, features = ["client", "server"] }

# Input handling
input = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter"] }
zbus = { workspace = true, features = ["blocking-api", "async-io"] }

# Error handling
anyhow = { workspace = true }

# libc for memfd_create, mmap, unix sockets
libc = { workspace = true }

# Linux-specific
nix = { workspace = true, features = ["ioctl", "fs", "event"] }
