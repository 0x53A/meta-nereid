[package]
name = "nereid-compositor"
version = "0.1.0"
edition = "2024"

[dependencies]
serde_json = "1"
shell-words = "1"
# Wayland compositor framework
smithay = { version = "0.7", default-features = false, features = [
    "wayland_frontend",
] }

# Wayland protocol support (server for compositor, client for test tools)
wayland-server = "0.31"
wayland-protocols = { version = "0.32", features = ["server"] }
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }

# Input handling
input = "0.9"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
anyhow = "1"

# libc for memfd_create, mmap, unix sockets
libc = "0.2"

# Linux-specific
nix = { version = "0.29", features = ["ioctl", "fs", "event"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
