<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN" "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <policy context="default">
    <deny own="io.Nereid.Auth1"/>
    <deny send_destination="io.Nereid.Auth1"/>
  </policy>
  <policy user="root">
    <allow own="io.Nereid.Auth1"/>
    <allow send_destination="io.Nereid.Auth1"/>
  </policy>
  <policy user="ceres">
    <allow send_destination="io.Nereid.Auth1" send_interface="io.Nereid.Auth1"/>
    <allow send_destination="io.Nereid.Auth1" send_interface="org.freedesktop.DBus.Properties" send_member="Get"/>
    <allow send_destination="io.Nereid.Auth1" send_interface="org.freedesktop.DBus.Properties" send_member="GetAll"/>
    <allow send_destination="io.Nereid.Auth1" send_interface="org.freedesktop.DBus.Introspectable"/>
  </policy>
</busconfig>
