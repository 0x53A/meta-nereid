# Shared source build for the Hoki UI, apps, compositor and core daemons.
[workspace]
resolver = "3"
members = [
    "nereid-auth",
    "hoki-lockscreen",
    "nereid-compositor",
    "hoki-overlay",
    "hoki-clock",
    "hoki-hwc-proxy",
    "hoki-launcher",
    "hoki-watchface",
    "hoki-settings",
    "hoki-powerd",
    "hoki-radiod",
    "hoki-networkd",
    "hoki-connect",
    "hoki-connect-ui",
    "hoki-activity",
    "hoki-haptics",
    "hoki-lp-watchface",
    "hoki-lp-placeholder",
    "hoki-spo2",
    "pebble-runner",
    "imu-test-app",
    "hoki-audio",
    "hoki-music",
    "hoki-audiobook",
    "hoki-podcast",
    "bt-pair",
    "hoki-nfc",
    "hoki-egui-demo",
    "demo-rust-app",
    "hoki-wasm-host",
    "hoki-assistant",
    "hoki-home-assistant",
]
default-members = [
    "nereid-auth",
    "hoki-lockscreen",
    "nereid-compositor",
    "hoki-overlay",
    "hoki-clock",
    "hoki-hwc-proxy",
    "hoki-launcher",
    "hoki-watchface",
    "hoki-settings",
    "hoki-powerd",
    "hoki-radiod",
    "hoki-networkd",
    "hoki-connect",
    "hoki-connect-ui",
    "hoki-activity",
    "hoki-haptics",
    "hoki-lp-watchface",
    "hoki-lp-placeholder",
    "hoki-spo2",
    "pebble-runner",
    "imu-test-app",
    "hoki-audio",
    "hoki-music",
    "hoki-audiobook",
    "hoki-podcast",
    "bt-pair",
    "hoki-nfc",
    "hoki-egui-demo",
    "demo-rust-app",
    "hoki-assistant",
    "hoki-home-assistant",
]
exclude = ["ble-ssh/host", "ble-ssh/watch-rs", "hoki-health-recorder", "hoki-wasm-guest"]

[workspace.package]
rust-version = "1.90"

[workspace.dependencies]
nereid-auth = { path = "nereid-auth" }
libsodium-sys-stable = { version = "1.24.0" }
rand_core = { version = "0.6" }
zeroize = { version = "1" }
cc = { version = "1" }
anyhow = { version = "1" }
armagnac = { git = "https://github.com/0x53A/armagnac.git", rev = "ba60e35ecaa79cd228b4a5d266723ec3e2772b2a" }
bluer = { version = "0.17.4" }
chrono = { version = "0.4" }
egui = { version = "0.31", default-features = false }
egui-winit = { version = "0.31", default-features = false }
flate2 = { version = "1" }
futures = { version = "0.3" }
futures-util = { version = "0.3" }
getrandom = { version = "0.2" }
gstreamer = { version = "0.23" }
image = { version = "0.25", default-features = false }
input = { version = "0.9" }
libc = { version = "0.2" }
libloading = { version = "0.8" }
libpulse-binding = { version = "2.30" }
md5 = { version = "0.7" }
memmap2 = { version = "0.9" }
nix = { version = "0.29" }
openssl = { version = "0.10" }
paste = { version = "1" }
reqwest = { version = "0.12", default-features = false }
ring = { version = "0.17" }
rodio = { version = "0.20", default-features = false }
rss = { version = "2" }
russh = { version = "0.63.3", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false }
rustls-rustcrypto = { version = "=0.0.2-alpha" }
serde = { version = "1" }
serde_json = { version = "1" }
shell-words = { version = "1.1" }
slint = { version = "=1.15.1", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software", "std"] }
slint-build = { version = "=1.15.1" }
smithay = { version = "0.7", default-features = false }
softbuffer = { version = "0.4" }
symphonia = { version = "0.6.1", default-features = false }
tokio = { version = "1" }
tokio-tungstenite = { version = "0.28", default-features = false }
tracing = { version = "0.1" }
tracing-subscriber = { version = "0.3" }
ureq = { version = "2" }
uuid = { version = "1" }
wasmi = { version = "0.42" }
wayland-client = { version = "0.31" }
wayland-protocols = { version = "0.32" }
wayland-protocols-wlr = { version = "0.3" }
wayland-server = { version = "0.31" }
winit = { version = "0.30", default-features = false }
zbus = { version = "5", default-features = false }
zip = { version = "2", default-features = false }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1

# Retain speed optimization for the player and emulator. Shared UI dependencies
# keep one common profile across applications.
[profile.release.package.hoki-music]
opt-level = 3

[profile.release.package.pebble-runner]
opt-level = 3

[profile.release.package.armagnac]
opt-level = 3

# The desktop Pebble emulator spends most startup time interpreting guest ARM.
# Keep debug builds responsive while retaining debuginfo for the runner itself.
[profile.dev.package.armagnac]
opt-level = 3

[profile.release.package.symphonia]
opt-level = 3

[profile.release.package.symphonia-bundle-flac]
opt-level = 3

[profile.release.package.symphonia-bundle-mp3]
opt-level = 3

[profile.release.package.symphonia-codec-aac]
opt-level = 3

[profile.release.package.symphonia-codec-alac]
opt-level = 3

[profile.release.package.symphonia-codec-pcm]
opt-level = 3

[profile.release.package.symphonia-codec-vorbis]
opt-level = 3

[profile.release.package.symphonia-common]
opt-level = 3

[profile.release.package.symphonia-core]
opt-level = 3

[profile.release.package.symphonia-format-isomp4]
opt-level = 3

[profile.release.package.symphonia-format-ogg]
opt-level = 3

[profile.release.package.symphonia-format-riff]
opt-level = 3

[profile.release.package.symphonia-metadata]
opt-level = 3
