[package]
name = "hoki-hwc-proxy"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libloading = "0.8"
libc = "0.2"
nix = { version = "0.29", features = ["socket", "mman", "fs"] }

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
