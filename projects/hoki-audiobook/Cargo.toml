[package]
name = "hoki-audiobook"
version = "0.1.0"
edition = "2021"
description = "Audiobook player for AsteroidOS"

[dependencies]
slint = { version = "1.15", default-features = false, features = ["compat-1-2", "backend-winit", "renderer-software"] }
gstreamer = "0.23"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[build-dependencies]
slint-build = "1.15"

[profile.release]
opt-level = "z"
lto = true
strip = true
codegen-units = 1
